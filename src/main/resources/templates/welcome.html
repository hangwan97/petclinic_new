<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - Spring PetClinic</title>
    <link rel="stylesheet" href="/webjars/bootstrap/5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/webjars/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .welcome-card {
            background: white;
            border-radius: 1rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .hero-icon {
            font-size: 5rem;
            color: #667eea;
        }
        .btn-custom {
            padding: 0.8rem 2rem;
            font-size: 1.1rem;
            border-radius: 2rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="welcome-card p-5 text-center">
                    <div class="hero-icon mb-4">
                        <i class="fa fa-paw"></i>
                    </div>
                    <h1 class="display-4 mb-3">Welcome to PetClinic</h1>
                    <p class="lead text-muted mb-4">
                        Your trusted companion in pet care and adoption
                    </p>
                    <div class="d-grid gap-3 d-md-block">
                        <a href="/adoption" class="btn btn-primary btn-custom">
                            <i class="fa fa-heart"></i> Browse Adoptions
                        </a>
                    </div>
                    <hr class="my-4">
                    <div class="row text-center">
                        <div class="col-md-4 mb-3 mb-md-0">
                            <i class="fa fa-users fa-2x text-primary mb-2"></i>
                            <p class="small text-muted">Professional Care</p>
                        </div>
                        <div class="col-md-4 mb-3 mb-md-0">
                            <i class="fa fa-heart fa-2x text-danger mb-2"></i>
                            <p class="small text-muted">Pet Adoption</p>
                        </div>
                        <div class="col-md-4">
                            <i class="fa fa-medkit fa-2x text-success mb-2"></i>
                            <p class="small text-muted">Health Services</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="/webjars/bootstrap/5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

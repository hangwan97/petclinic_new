<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'test')}">

<body>

  <h2>Pet Tests & Examinations</h2>
  <p class="lead">Pet test results and examination records</p>

  <table class="table table-striped table-hover">
    <thead class="table-dark">
      <tr>
        <th>Pet Name</th>
        <th>Test Type</th>
        <th>Date Administered</th>
        <th>Result</th>
        <th>Veterinarian</th>
        <th>Follow-up Needed</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="test : ${petTests}">
        <td th:text="${test.petName}">Max</td>
        <td th:text="${test.testType}">Blood Test</td>
        <td th:text="${#temporals.format(test.dateAdministered, 'yyyy-MM-dd')}">2024-03-20</td>
        <td th:text="${test.result}">Normal</td>
        <td th:text="${test.veterinarian}">Dr. Smith</td>
        <td th:text="${test.followUpNeeded ? 'Yes' : 'No'}">No</td>
      </tr>
      <tr th:if="${#lists.isEmpty(petTests)}">
        <td colspan="6" class="text-center text-muted">No test records available</td>
      </tr>
    </tbody>
  </table>

</body>

</html>

<!doctype html>
<html th:fragment="layout (template, menu)" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="shortcut icon" type="image/x-icon" th:href="@{/resources/images/favicon.png}">

  <title>PetClinic :: a Spring Framework demonstration</title>

  <link rel="stylesheet" th:href="@{/resources/css/petclinic.css}" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- HTML5 shim and Respond.js for IE8 support of HTML5 elements and media queries -->
  <!--[if lt IE 9]>
    <script src="https://oss.maxcdn.com/html5shiv/3.7.2/html5shiv.min.js"></script>
    <script src="https://oss.maxcdn.com/respond/1.4.2/respond.min.js"></script>
  <![endif]-->
</head>

<body>

  <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #34302D;">
    <div class="container">
      <a class="navbar-brand" th:href="@{/}">
        <span>Spring Pet Clinic</span>
      </a>
      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#main-navbar">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="main-navbar">
        <ul class="navbar-nav mr-auto">
          <li th:fragment="menuItem (link,active,title,glyph,text)" class="nav-item"
            th:class="${active==menu ? 'active' : ''}">
            <a class="nav-link" th:href="@{${link}}" th:title="${title}">
              <span th:class="'fa fa-'+${glyph}" class="fa"></span>
              <span th:text="${text}">Template</span>
            </a>
          </li>
          <li th:replace="~{::menuItem ('/','home','Home page','home','Home')}">
            <span class="fa fa-home" aria-hidden="true"></span>
            <span>Home</span>
          </li>
          <li th:replace="~{::menuItem ('/owners/find','owners','Find owners','search','Find owners')}">
            <span class="fa fa-search" aria-hidden="true"></span>
            <span>Find owners</span>
          </li>
          <li th:replace="~{::menuItem ('/adoption','adoption','Pet adoption','heart','Adopt Me')}">
            <span class="fa fa-heart" aria-hidden="true"></span>
            <span>Adopt Me</span>
          </li>
          <li th:replace="~{::menuItem ('/vets','vets','Veterinarians','th-list','Veterinarians')}">
            <span class="fa fa-th-list" aria-hidden="true"></span>
            <span>Veterinarians</span>
          </li>
          <li th:replace="~{::menuItem ('/oups','error','Trigger a RuntimeException to see how it is handled','exclamation-triangle','Error')}">
            <span class="fa fa-exclamation-triangle" aria-hidden="true"></span>
            <span>Error</span>
          </li>
        </ul>
      </div>
    </div>
  </nav>
  <div class="container-fluid">
    <div class="container xd-container">
      <th:block th:include="${template}" />

      <br />
      <br />
      <div class="row">
        <div class="col-12 text-center">
          <div class="card border-0">
            <div class="card-body bg-light">
              <div class="container text-center">
                <p class="text-muted">Spring Pet Clinic &copy; 2023</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

</body>

</html>
